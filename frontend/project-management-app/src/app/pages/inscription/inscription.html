<div class="register-container">

  <div class="form-box">
    <!-- <div class="button">
      <button class="btn-connexion" routerLink="/login">
      CONNEXION
      </button>
      <button class="btn-inscription" routerLink="/register">
      INSCRIPTION
      </button>
    </div> -->

    <!-- <h2 class="title">Create Account</h2> -->

    <form (ngSubmit)="register()">

      <!-- <label>Nom</label> -->
      <input 
        type="text" 
        class="form-control"
        [(ngModel)]="registerData.name"
        name="name"
        placeholder="Enter your name"
        required>

      <!-- <label class="mt-3">Email</label> -->
      <input 
        type="email" 
        class="form-control"
        [(ngModel)]="registerData.email"
        name="email"
        placeholder="Enter your email"
        required>

      <!-- <label class="mt-3">Mot de passe</label> -->
      <input 
        type="password" 
        class="form-control"
        [(ngModel)]="registerData.password"
        name="password"
        placeholder="Enter your password"
        required>

      <!-- <label class="mt-3">Confirmer mot de passe</label> -->
      <input 
        type="password" 
        class="form-control"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        required>

      <button type="submit" class="btn-register mt-4">
        REGISTER
      </button>

    </form>

    <p class="mt-4 text-center">
      Already have an account ?
      <!-- <a routerLink="/login">Login</a> -->
    </p>

    <button class="btn-login" routerLink="/login">
      LOGIN
    </button>

  </div>
</div>
