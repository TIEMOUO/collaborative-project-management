<div class="login-container">
  <div class="form-box">
    <h4>Sign in to TASK<span class="color">FLOW</span></h4>
    <!-- <label>Email</label> -->
    <input type="email" class="form-control" [(ngModel)]="loginData.email" name="email" required
    placeholder="Enter your email" required>

    <!-- <label class="mt-3">Password</label> -->
    <input type="password" class="form-control" [(ngModel)]="loginData.password" name="password" required 
    placeholder="Enter your password" required>

    <div class="options mt-2">
      <a href="#">Remember me</a>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-login mt-4" (click)="login()">
      LOGIN
    </button>

    <p class="mt-3 text-center">
      Not a member yet ?
      <!-- <a routerLink="/register">Register</a> -->
    </p>

    <button class="btn-register" routerLink="/register">
      REGISTER
    </button>

  </div>

</div>
